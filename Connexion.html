<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Connexion - Cap'Tivant</title>
  <link rel="stylesheet" href="PageAccueil.css">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
  <script src="info-bateau.js" defer></script>
  <style>
    .connexion-card {
      background: white;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95em;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #577550;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1em;
      color: #777;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #f29066;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: #e57d52;
      transform: translateY(-1px);
    }

    .links-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links-container a {
      color: #577550;
      text-decoration: none;
      font-size: 0.9em;
      font-weight: 500;
    }

    .links-container a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body style="background-color: #c5d8d3; display: flex; flex-direction: column; min-height: 100vh;">

<!-- Menu -->
<div class="top-left" onclick="toggleMenu()">
  <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
  <div class="menu-content" id="menu-links"></div>
</div>

<!-- En-tête centre -->
<div class="top-center">
  <div class="logo-block">
    <a href="PageAccueil.html">
      <img src="images/logo-transparent.png" alt="Logo">
    </a>
    <p class="logo-slogan">Cap'Tivant</p>
    <h1 class="page-title" id="titre-page" style="color: #577550">Connexion</h1>
  </div>
</div>

<!-- Haut droit -->
<div class="top-right">
  <div class="language-selector">
    <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
    <div id="lang-dropdown" class="lang-dropdown"></div>
  </div>
  <a href="a-propos.html" id="lien-apropos" style="color: #577550; text-decoration: none;">À propos</a>
  <a href="Connexion.html" id="lien-compte" style="color: #577550; text-decoration: none;">Mon Compte</a>
  <a href="favoris.html"><img src="images/panier.png" alt="Panier"></a>
</div>

<!-- Formulaire de Connexion -->
<main style="flex: 1; margin-top: 150px; padding-bottom: 40px; display: flex; align-items: center; justify-content: center; width: 100%;">
  <div class="connexion-card">
    <form id="form-login" onsubmit="connexionUtilisateur(event)">
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" placeholder="Adresse e-mail" required>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Mot de passe" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-connexion">Se connecter</button>
    </form>

    <div class="links-container">
      <a href="Inscription.html" id="link-signup">Pas encore de compte ? S'inscrire</a>
      <a href="mdp-oublier.html" id="link-forgot">Mot de passe oublié ?</a>
    </div>
  </div>
</main>

<!-- Pied de page -->
<div class="bouton-bas" style="background: transparent; padding: 20px 0;">
  <a href="MentionsLegales.html" id="lien-mentions" class="bottom-text">Mentions légales</a>
  <span class="bottom-text">•</span>
  <a href="Contact.html" id="lien-contact" class="bottom-text">Contact</a>
</div>

<script>
  function toggleMenu() {
    document.getElementById("menu-overlay").classList.toggle("active");
  }

  function toggleLangDropdown() {
    const dropdown = document.getElementById("lang-dropdown");
    dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
  }

  function changerLangue(langue) {
    localStorage.setItem("langue", langue);
    location.reload();
  }

  function getLangue() {
    return localStorage.getItem("langue") || "fr";
  }

  document.addEventListener("DOMContentLoaded", function () {
    const langue = getLangue();
    const texteCommun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});

    // Textes traduits
    const isEN = langue === "en";
    document.title = isEN ? "Login - Cap'Tivant" : "Connexion - Cap'Tivant";
    document.getElementById("titre-page").textContent = isEN ? "Login" : "Connexion";
    document.getElementById("email").placeholder = isEN ? "Enter your email address" : "Adresse e-mail";
    document.getElementById("password").placeholder = isEN ? "Enter your password" : "Mot de passe";
    document.getElementById("btn-connexion").textContent = isEN ? "Log in" : "Se connecter";
    document.getElementById("link-signup").textContent = isEN ? "Sign up" : "Pas encore de compte ? S'inscrire";
    document.getElementById("link-forgot").textContent = isEN ? "Forgot password?" : "Mot de passe oublié ?";

    if (texteCommun.info) document.getElementById("lien-apropos").textContent = texteCommun.info;
    if (texteCommun.mentions) document.getElementById("lien-mentions").textContent = texteCommun.mentions;
    if (texteCommun.contact) document.getElementById("lien-contact").textContent = texteCommun.contact;

    // Statut Compte en haut à droite
    const user = JSON.parse(localStorage.getItem("user") || "null");
    const lienCompte = document.getElementById("lien-compte");
    if (lienCompte) {
      if (user && user.firstName) {
        lienCompte.textContent = user.firstName;
        lienCompte.setAttribute("href", "MonCompte.html");
      } else if (texteCommun.compte) {
        lienCompte.textContent = texteCommun.compte;
        lienCompte.setAttribute("href", "Connexion.html");
      }
    }

    // Menu overlay
    if (texteCommun.menu) {
      const menuContent = document.getElementById("menu-links");
      const destinationCompte = (user && user.firstName) ? "MonCompte.html" : "Connexion.html";
      const liens = ["location.html", "ports.html", destinationCompte, "historique.html", "faq.html", "avis.html"];

      menuContent.innerHTML = texteCommun.menu.map((item, index) => {
        return `<a href="${liens[index]}">${item}</a>`;
      }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
    }

    // Drapeau
    document.getElementById("current-lang").src = isEN ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
    document.getElementById("lang-dropdown").innerHTML = isEN
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;
  });

  function connexionUtilisateur(e) {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const firstName = email.split('@')[0]; // Extrait un prénom fictif de l'adresse mail

    const userObj = {
      email: email,
      firstName: firstName.charAt(0).toUpperCase() + firstName.slice(1)
    };

    localStorage.setItem("user", JSON.stringify(userObj));
    alert(getLangue() === "en" ? "Successfully logged in!" : "Connexion réussie !");
    window.location.href = "MonCompte.html";
  }
</script>
</body>
</html>
