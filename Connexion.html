<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Connexion</title>
  <link rel="stylesheet" href="PageAccueil.css">
  <link rel="stylesheet" href="Connexion.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <script src="info-bateau.js" defer></script>
  <script>
    function getLangue() {
      return localStorage.getItem("langue") || "fr";
    }

    function toggleMenu() {
      const menu = document.getElementById("menu-overlay");
      menu.classList.toggle("active");
    }

    function toggleLangDropdown() {
      const dropdown = document.getElementById("lang-dropdown");
      dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
      localStorage.setItem("langue", langue);
      location.reload();
    }

    document.addEventListener("click", function(event) {
      const dropdown = document.getElementById("lang-dropdown");
      const icon = document.getElementById("current-lang");
      if (!dropdown.contains(event.target) && !icon.contains(event.target)) {
        dropdown.style.display = "none";
      }
    });

    document.addEventListener("DOMContentLoaded", function () {
      const langue = getLangue();
      const commun = langue === "en" ? CommunEN : CommunFR;
      const texte = langue === "en" ? ConnexionEN : ConnexionFR;

      document.title = texte.titre;
      document.getElementById("page-title").textContent = texte.titre;
      document.getElementById("titre-page").textContent = texte.titre;
      document.getElementById("email").placeholder = texte.email;
      document.getElementById("password").placeholder = texte.mdp;
      document.getElementById("btn-connexion").textContent = texte.bouton;
      document.getElementById("inscription-lien").textContent = texte.inscription;
      document.getElementById("mdp-lien").textContent = texte.mdpOublie;

      document.getElementById("lien-mentions").textContent = commun.mentions;
      document.getElementById("lien-contact").textContent = commun.contact;

      const currentLang = document.getElementById("current-lang");
      currentLang.src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";

      const langDropdown = document.getElementById("lang-dropdown");
      langDropdown.innerHTML = langue === "en"
              ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" onclick="changerLangue('fr')">`
              : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" onclick="changerLangue('en')">`;

      const menuContent = document.getElementById("menu-links");
      const liens = ["location", "ports", "MonCompte", "historique", "faq", "avis"];
      menuContent.innerHTML = commun.menu.map((item, index) => {
        return `<a href="${liens[index]}.html">${item}</a>`;
      }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';

      const lienApropos = document.getElementById("lien-apropos");
      lienApropos.textContent = commun.info;
      lienApropos.setAttribute("href", "a-propos.html");
    });

    // Traitement de la connexion côté navigateur
    function simulerConnexion(event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-message");

      if (!email || !password) {
        errorMsg.textContent = "Veuillez remplir tous les champs.";
        errorMsg.style.display = "block";
        return;
      }

      // Enregistre l'utilisateur connecté dans localStorage
      const user = {
        email: email,
        firstName: email.split('@')[0] || "Utilisateur"
      };
      localStorage.setItem("user", JSON.stringify(user));

      // Redirection vers MonCompte
      window.location.href = "MonCompte.html";
    }

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      const icon = document.querySelector(`[onclick="togglePasswordVisibility('${inputId}')"]`);

      if (input.type === "password") {
        input.type = "text";
        icon.src = "images/eye-open.png";
        icon.alt = "Masquer mot de passe";
      } else {
        input.type = "password";
        icon.src = "images/eye-closed.png";
        icon.alt = "Afficher mot de passe";
      }
    }
  </script>
</head>
<body>
<div class="top-left" onclick="toggleMenu()">
  <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
  <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-right">
  <div class="language-selector">
    <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon">
    <div id="lang-dropdown" class="lang-dropdown"></div>
  </div>
  <a id="lien-apropos" href="a-propos.html" style="color: #577550; text-decoration: none;">À propos</a>
  <a href="favoris.html">
    <img src="images/panier.png" alt="Panier">
  </a>
</div>

<div class="top-center">
  <div class="logo-block">
    <a href="PageAccueil.html">
      <img src="images/logo-transparent.png" alt="Logo" style="width: 30px;">
    </a>
    <p class="logo-slogan">Cap'Tivant</p>
    <h1 class="page-title" id="titre-page">Connexion</h1>
  </div>

  <form onsubmit="simulerConnexion(event)" class="formulaire-connexion">
    <div class="champ">
      <img src="images/email.png" alt="email">
      <input type="email" id="email" placeholder="Entrez votre adresse mail" required>
    </div>
    <div class="champ">
      <img src="images/mdp.png" alt="mot de passe">
      <div class="input-container" style="display: flex; align-items: center; width: 100%;">
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required style="flex-grow: 1;">
        <img src="images/eye-closed.png" alt="Afficher mot de passe" class="eye-icon" onclick="togglePasswordVisibility('password')" style="cursor: pointer; margin-left: 5px;">
      </div>
    </div>
    <button type="submit" class="connexion" id="btn-connexion" style="border: none; cursor: pointer;">Se connecter</button>
  </form>

  <p id="error-message" style="color:red; text-align:center; display:none; margin-top: 10px;"></p>

  <div class="logo-block">
    <a id="inscription-lien" href="Inscription.html" class="inscription" style="text-decoration: none; font-size: 1.2em">Inscription</a>
    <a id="mdp-lien" href="mdp-oublier.html" class="mdp-oublier" style="text-decoration: none; font-size: 1.2em">Mot de passe oublié</a>
  </div>
</div>

<div class="bouton-bas">
  <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color: #577550">Mentions légales</a>
  <span class="bottom-text" style="color: #577550">•</span>
  <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #577550">Contact</a>
</div>
</body>
</html>
