<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Réinitialiser votre mot de passe</title>
  <link rel="stylesheet" href="PageAccueil.css">
  <link rel="stylesheet" href="mdp-oublier.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <script src="info-bateau.js" defer></script>
</head>
<body style="background-color: #c5d8d3;">

<!-- Zone de message de confirmation -->
<div id="message-success" style="display: none; flex-direction: column; align-items: center; justify-content: center; margin-top: 150px;">
  <p id="lien" style="color: rgb(87,117,80); font-weight: bold; font-size: 1.3em; margin-bottom: 10px; min-height: 1.5em; text-align: center;"></p>
  <p id="email-affiche" style="font-size: 1.1em; color: #333;"></p>
</div>

<div class="top-left" onclick="toggleMenu()">
  <img src="images/menu.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
  <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-right">
  <div class="language-selector">
    <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
    <div id="lang-dropdown" class="lang-dropdown"></div>
  </div>
  <a id="a-propos-link" href="a-propos.html" style="color: #e0e0d5; text-decoration: none;">À propos</a>
  <a id="lien-compte" href="Connexion.html" style="color: #e0e0d5; text-decoration: none;">Mon Compte</a>
  <a href="favoris.html">
    <img src="images/panier.png" alt="Panier">
  </a>
</div>

<div class="top-center">
  <div class="logo-block">
    <a href="PageAccueil.html">
      <img src="images/logo.png" alt="Logo">
    </a>
    <p class="logo-slogan">Cap'Tivant</p>
    <h1 class="page-title" id="titre-page"></h1>
  </div>

  <form onsubmit="envoyerLienMdp(event)" class="formulaire-connexion">
    <div class="champ">
      <img src="images/email.png" alt="email">
      <input type="email" id="email" name="email" placeholder="E-mail lié au compte" required>
    </div>
    <div class="logo-block">
      <div class="connexion" style="margin-top: 15px;">
        <button type="submit" style="color: white; text-decoration: none; background:none; border:none; font-size: 17px; font-family: 'DM Serif Display', serif; cursor: pointer;" id="bouton">
          Envoyer un lien
        </button>
      </div>
      <div class="retour" style="margin-top: 15px;">
        <a href="Connexion.html" style="color: #ee9c72; text-decoration: none; font-size: 17px;" id="retour">Retour à la connexion</a>
      </div>
    </div>
  </form>
</div>

<div class="bouton-bas">
  <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color: #577550">Mentions légales</a>
  <span class="bottom-text" style="color: #577550">&bull;</span>
  <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #577550">Contact</a>
</div>

<script>
  function toggleMenu() {
    const menu = document.getElementById("menu-overlay");
    menu.classList.toggle("active");
  }

  function toggleLangDropdown() {
    const dropdown = document.getElementById("lang-dropdown");
    dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
  }

  function changerLangue(langue) {
    localStorage.setItem("langue", langue);
    location.reload();
  }

  function getLangue() {
    return localStorage.getItem("langue") || "fr";
  }

  document.addEventListener("click", function(event) {
    const dropdown = document.getElementById("lang-dropdown");
    const icon = document.getElementById("current-lang");
    if (dropdown && icon && !dropdown.contains(event.target) && !icon.contains(event.target)) {
      dropdown.style.display = "none";
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    const langue = getLangue();
    const texte = langue === "en" ? (typeof MdpEN !== "undefined" ? MdpEN : {}) : (typeof MdpFR !== "undefined" ? MdpFR : {});
    const commun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});

    if (texte.titre) {
      document.getElementById("page-title").textContent = texte.titre;
      document.getElementById("titre-page").textContent = texte.titre;
    }
    if (texte.placeholder) document.getElementById("email").placeholder = texte.placeholder;
    if (texte.bouton) document.getElementById("bouton").textContent = texte.bouton;
    if (texte.retour) document.getElementById("retour").textContent = texte.retour;

    if (commun.mentions) document.getElementById("lien-mentions").textContent = commun.mentions;
    if (commun.contact) document.getElementById("lien-contact").textContent = commun.contact;
    if (commun.info) document.getElementById("a-propos-link").textContent = commun.info;

    // Statut Utilisateur connecté & redirection dynamique
    const user = JSON.parse(localStorage.getItem("user") || "null");
    const estConnecte = user && user.firstName;
    const pageCompteDestination = estConnecte ? "MonCompte.html" : "Connexion.html";

    const lienCompte = document.getElementById("lien-compte");
    if (lienCompte) {
      lienCompte.setAttribute("href", pageCompteDestination);
      if (estConnecte) {
        lienCompte.textContent = user.firstName;
      } else if (commun.compte) {
        lienCompte.textContent = commun.compte;
      }
    }

    document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
    document.getElementById("lang-dropdown").innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;

    // Génération du menu latéral avec redirection dynamique
    if (commun.menu) {
      const liens = ["location.html", "ports.html", pageCompteDestination, "historique.html", "faq.html", "avis.html"];
      const menuContent = document.getElementById("menu-links");
      menuContent.innerHTML = commun.menu.map((item, index) => {
        return `<a href="${liens[index]}">${item}</a>`;
      }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
    }
  });

  function envoyerLienMdp(event) {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const langue = getLangue();
    const texte = langue === "en" ? (typeof MdpEN !== "undefined" ? MdpEN : {}) : (typeof MdpFR !== "undefined" ? MdpFR : {});

    if (email) {
      const messageDiv = document.getElementById("message-success");
      const lienText = document.getElementById("lien");
      const emailAffiche = document.getElementById("email-affiche");

      lienText.textContent = texte.lien || (langue === "en" ? "A reset link has been sent to:" : "Un lien de réinitialisation a été envoyé à :");
      emailAffiche.textContent = email;
      messageDiv.style.display = "flex";
    }
  }
</script>
</body>
</html>
