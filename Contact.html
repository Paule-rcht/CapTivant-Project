<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Contact</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="Contact.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
    <script>
        function getLangue() {
            return localStorage.getItem("langue") || "fr";
        }

        function toggleMenu() {
            const menu = document.getElementById("menu-overlay");
            menu.classList.toggle("active");
        }

        function toggleLangDropdown() {
            const dropdown = document.getElementById("lang-dropdown");
            dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
        }

        function changerLangue(langue) {
            localStorage.setItem("langue", langue);
            location.reload();
        }

        document.addEventListener("click", function(event) {
            const dropdown = document.getElementById("lang-dropdown");
            const icon = document.getElementById("current-lang");
            if (!dropdown.contains(event.target) && !icon.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });

        document.addEventListener("DOMContentLoaded", function () {
            const langue = getLangue();
            const texte = langue === "en" ? ContactEN : ContactFR;
            const commun = langue === "en" ? CommunEN : CommunFR;

            document.title = texte.titre;
            document.getElementById("page-title").textContent = texte.titre;
            document.getElementById("titre-page").textContent = texte.titre;
            document.getElementById("contact-texte").textContent = texte.texte;

            const nomInput = document.getElementById("nom");
            const mailInput = document.getElementById("mail");
            const telInput = document.getElementById("tel");
            if (nomInput) nomInput.placeholder = texte.nom;
            if (mailInput) mailInput.placeholder = texte.email;
            if (telInput) telInput.placeholder = texte.telephone;

            document.getElementById("label-msg").textContent = texte.label;
            document.getElementById("msg").placeholder = texte.msg;
            document.getElementById("btn-envoyer").textContent = texte.bouton;

            document.getElementById("lien-mentions").textContent = commun.mentions;
            document.getElementById("lien-contact").textContent = commun.contact;

            const user = JSON.parse(localStorage.getItem("user") || "null");
            const lienCompteDestination = (user && user.firstName) ? "MonCompte.html" : "Connexion.html";

            if (texteCommun.menu) {
                const menuContent = document.getElementById("menu-links");
                const liens = ["location.html", "ports.html", lienCompteDestination, "historique.html", "faq.html", "avis.html"];
                menuContent.innerHTML = texteCommun.menu.map((item, index) => {
                    return `<a href="${liens[index]}">${item}</a>`;
                }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
            }

            document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
            const langDropdown = document.getElementById("lang-dropdown");
            langDropdown.innerHTML = langue === "en"
                ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" onclick="changerLangue('fr')">`
                : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" onclick="changerLangue('en')">`;

            const liens = ["location", "ports", "MonCompte", "historique", "faq", "avis"];
            const menuContent = document.getElementById("menu-links");
            menuContent.innerHTML = commun.menu.map((item, index) => {
                return `<a href="${liens[index]}.html">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';

            const lienApropos = document.getElementById("lien-apropos");
            if (lienApropos) {
                lienApropos.textContent = commun.info;
                lienApropos.setAttribute("href", "a-propos.html");
            }
        });

        function envoyerMessage(event) {
            event.preventDefault();
            const messageStatut = document.getElementById("message-statut");
            const langue = getLangue();

            messageStatut.textContent = langue === "en" ? "Your message has been sent successfully." : "Votre message a bien été envoyé.";
            messageStatut.style.color = "green";
            messageStatut.style.display = "block";

            // Réinitialiser le formulaire
            document.getElementById("form-contact").reset();
        }
    </script>
</head>
<body style="background-color: #c5d8d3;">
<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="lien-apropos" href="a-propos.html" style="color: #577550; text-decoration: none;">À propos</a>
    <a id="lien-compte" href="Connexion.html" style="color: #577550; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo-transparent.png" alt="Logo" style="width: 30px;">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-page">Nous contacter</h1>

        <p id="message-statut" style="text-align: center; font-weight: bold; display: none; margin-bottom: 10px;"></p>

        <p class="texte" id="contact-texte" style="text-shadow: none;">
            Pour toute question, veuillez nous contacter par mail à captivant@gmail.com ou via le formulaire de contact ci-dessous.
        </p>
    </div>

    <form id="form-contact" onsubmit="envoyerMessage(event)" class="formulaire-connexion">
        <div class="champ-double">
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="email" id="mail" placeholder="E-mail" required>
        </div>
        <div class="champ">
            <input type="text" id="tel" placeholder="Entrez votre téléphone">
            <br>
            <label for="msg" id="label-msg">Message</label>
        </div>
        <div class="champ-msg">
            <textarea id="msg" placeholder="Entrez votre message" required></textarea>
        </div>
        <button type="submit" id="btn-envoyer" class="connexion" style="border: none; cursor: pointer;">Envoyer</button>
    </form>
</div>

<div class="bouton-bas">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color: #577550">Mentions légales</a>
    <span class="bottom-text" style="color: #577550">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #577550">Contact</a>
</div>
</body>
</html>
