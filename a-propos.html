<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">À propos</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="a-propos.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
    <script>
        function getLangue() {
            return localStorage.getItem("langue") || "fr";
        }

        function toggleMenu() {
            const menu = document.getElementById("menu-overlay");
            menu.classList.toggle("active");
        }

        function toggleLangDropdown() {
            const dropdown = document.getElementById("lang-dropdown");
            dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
        }

        function changerLangue(langue) {
            localStorage.setItem("langue", langue);
            location.reload();
        }

        document.addEventListener("DOMContentLoaded", function () {
            const langue = getLangue();
            const contenu = langue === "en" ? AProposEN : AProposFR;
            const commun = langue === "en" ? CommunEN : CommunFR;

            document.title = contenu.titre;
            document.getElementById("page-title").textContent = contenu.titre;
            document.getElementById("titre-page").textContent = contenu.titre;
            document.getElementById("banniere-texte").textContent = contenu.banniere;

            const description = document.getElementById("description-a-propos");
            description.innerHTML = "";
            if (contenu.paragraphes && Array.isArray(contenu.paragraphes)) {
                contenu.paragraphes.forEach(p => {
                    const paragraphe = document.createElement("p");
                    paragraphe.textContent = p;
                    description.appendChild(paragraphe);
                });
            }

            const currentLang = document.getElementById("current-lang");
            currentLang.src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";

            const langDropdown = document.getElementById("lang-dropdown");
            langDropdown.innerHTML = langue === "en"
                ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" onclick="changerLangue('fr')">`
                : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" onclick="changerLangue('en')">`;

            document.getElementById("lien-apropos").textContent = commun.info;
            document.getElementById("lien-mentions").textContent = commun.mentions;
            document.getElementById("lien-contact").textContent = commun.contact;

            // Gestion de l'affichage Mon Compte selon le localStorage
            const user = JSON.parse(localStorage.getItem("user") || "null");
            const lienCompteDestination = (user && user.firstName) ? "MonCompte.html" : "Connexion.html";

            if (texteCommun.menu) {
                const menuContent = document.getElementById("menu-links");
                const liens = ["location.html", "ports.html", lienCompteDestination, "historique.html", "faq.html", "avis.html"];
                menuContent.innerHTML = texteCommun.menu.map((item, index) => {
                    return `<a href="${liens[index]}">${item}</a>`;
                }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
            }

            // Génération du menu de navigation vers .html
            const menuContent = document.getElementById("menu-links");
            const liens = ["location", "ports", "MonCompte", "historique", "faq", "avis"];
            menuContent.innerHTML = commun.menu.map((item, index) => {
                return `<a href="${liens[index]}.html">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        });

        document.addEventListener("click", function(event) {
            const dropdown = document.getElementById("lang-dropdown");
            const icon = document.getElementById("current-lang");
            if (!dropdown.contains(event.target) && !icon.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>
</head>
<body style="background-color: #c5d8d3;">
<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo-transparent.png" alt="Logo" style="width: 30px;">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-page">À propos</h1>
    </div>
</div>

<div class="banniere">
    <div class="texte banniere1" id="banniere-texte">Équipage Cap'Tivant</div>
</div>

<div class="description" id="description-a-propos" style="max-width: 800px; margin: 0 auto; padding: 20px; font-family: 'Questrial', sans-serif; font-size: 1.1em;"></div>

<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="lien-apropos" href="a-propos.html" style="color: #577550; text-decoration: none;">À propos</a>
    <a id="lien-compte" href="Connexion.html" style="color: #577550; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<div class="bouton-bas">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color: #577550">Mentions légales</a>
    <span class="bottom-text" style="color: #577550">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #577550">Contact</a>
</div>
</body>
</html>
