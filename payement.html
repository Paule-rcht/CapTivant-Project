<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title id="page-title">Paiement</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="payement.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
</head>
<body style="background-color: #c5d8d3;">

<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu.png" alt="Menu">
</div>

<!-- Fil d’Ariane -->
<div class="top-left retour-offre">
    <a id="lien-retour-offre" href="offre.html">Offre &gt;</a>
    <a id="lien-info-bateau"><label id="titre-bateau-label" style="cursor: pointer;"></label><span> &gt;</span></a>
    <label style="font-size: 0.85em; color: rgba(224,224,213,0.65); font-family: 'DM Serif Display', serif;">Réservation</label>
</div>

<!-- Logo et titre -->
<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo.png" alt="Logo">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-bateau" style="color: #E0E0D5">Paiement</h1>
    </div>
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<!-- Lien langue / compte -->
<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="a-propos-link" href="a-propos.html" style="color: #E0E0D5; text-decoration: none;">À propos</a>
    <a id="lien-compte" href="Connexion.html" style="color: #E0E0D5; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="panier">
    </a>
</div>

<div class="background">
    <div class="conteneur-info">
        <div class="carte-bateau" id="carte-bateau">
            <h2 id="titre-fiche">Chargement...</h2>
            <p><strong id="lbl-port">Port :</strong> <span id="port"></span></p>
            <p><strong id="lbl-personnes">Nombre de personnes maximum :</strong> <span id="personnes"></span></p>
            <p><strong id="lbl-cabines">Cabines :</strong> <span id="cabines"></span></p>
            <p><strong id="lbl-longueur">Longueur :</strong> <span id="longueur"></span></p>
            <p><strong id="lbl-prix">Prix :</strong> <span id="prix"></span></p>
            <p><strong id="lbl-avis">Avis :</strong> <span id="avis"></span></p>

            <div style="margin-top: 15px; color: #f29066; text-align: center">
                <label for="date_debut" id="lbl-date-debut">Date de départ :</label><br>
                <input type="date" id="date_debut" required><br><br>

                <label for="date_fin" id="lbl-date-fin">Date de retour :</label><br>
                <input type="date" id="date_fin" required>
            </div>
        </div>

        <div>
            <div class="select-personnes-container">
                <label for="select-personnes" id="lbl-select-pers"><strong>Sélectionnez le nombre de personnes :</strong></label>
                <select id="select-personnes"></select>
                <p id="erreur-nb-personnes" style="color: red; text-align: center; display: none;">
                    Veuillez sélectionner le nombre de personnes.
                </p>
            </div>

            <div class="enfant-a-bord">
                <input type="checkbox" id="enfant-checkbox" />
                <label for="enfant-checkbox" id="lbl-enfant">Enfant à bord</label>
            </div>

            <div class="options-bateau">
                <h3 id="lbl-options-titre">Options supplémentaires</h3>
                <br>
                <label><input type="checkbox" class="option-checkbox" value="skipper" data-prix="200"> <span id="lbl-skipper">Skipper (+200€)</span></label><br>
                <label><input type="checkbox" class="option-checkbox" value="nettoyage" data-prix="80"> <span id="lbl-nettoyage">Nettoyage final (+80€)</span></label><br>
                <label><input type="checkbox" class="option-checkbox" value="literie" data-prix="50"> <span id="lbl-literie">Literie et serviettes (+50€)</span></label>
            </div>
        </div>
    </div>
</div>

<div class="total-et-paiement" id="zone-paiement" style="margin-top: 20px; text-align: center;">
    <p><strong id="lbl-total">Total à payer :</strong> <span id="total-prix">0€</span></p>
    <button type="button" id="btn-payer" style="border: none; cursor: pointer;">Payer</button>
</div>

<!-- Pied de page -->
<div class="bouton-bas" style="background: transparent">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text">Mentions légales</a>
    <span class="bottom-text">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text">Contact</a>
</div>

<script>
    function toggleMenu() {
        const menu = document.getElementById("menu-overlay");
        menu.classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    function getLangue() {
        return localStorage.getItem("langue") || "fr";
    }

    let avisList = [];
    try {
        avisList = JSON.parse(localStorage.getItem("avis") || "[]");
    } catch (e) {
        avisList = [];
    }

    function calculerMoyenneAvis(titre) {
        const avisBateau = avisList.filter(a => a && a.titre === titre && !isNaN(a.etoiles));
        const nbAvis = avisBateau.length;
        if (nbAvis === 0) return { moyenne: 0, total: 0 };
        const somme = avisBateau.reduce((acc, cur) => acc + Number(cur.etoiles), 0);
        return { moyenne: (somme / nbAvis), total: nbAvis };
    }

    function genererAvisTexte(note, totalAvis) {
        if (totalAvis === 0) return `⭐ (0 avis)`;
        const noteAffichee = (note % 1 === 0) ? note.toFixed(0) : note.toFixed(1);
        return `⭐ ${noteAffichee}/5 (${totalAvis} avis)`;
    }

    document.addEventListener("click", function(event) {
        const dropdown = document.getElementById("lang-dropdown");
        const icon = document.getElementById("current-lang");
        if (dropdown && icon && !dropdown.contains(event.target) && !icon.contains(event.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        const langue = getLangue();
        const dataBateaux = langue === "en" ? (typeof bateauxEN !== "undefined" ? bateauxEN : []) : (typeof bateaux !== "undefined" ? bateaux : []);
        const texte = langue === "en" ? (typeof PaiementEN !== "undefined" ? PaiementEN : {}) : (typeof PaiementFR !== "undefined" ? PaiementFR : {});
        const texteCommun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});

        // Textes globaux
        if (texte.titre) {
            document.title = texte.titre;
            document.getElementById("titre-bateau").textContent = texte.titre;
        }
        if (texteCommun.info) document.getElementById("a-propos-link").textContent = texteCommun.info;
        if (texteCommun.mentions) document.getElementById("lien-mentions").textContent = texteCommun.mentions;
        if (texteCommun.contact) document.getElementById("lien-contact").textContent = texteCommun.contact;

        // Statut Utilisateur connecté & redirection dynamique
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const estConnecte = user && user.firstName;
        const pageCompteDestination = estConnecte ? "MonCompte.html" : "Connexion.html";

        const lienCompte = document.getElementById("lien-compte");
        if (lienCompte) {
            lienCompte.setAttribute("href", pageCompteDestination);
            if (estConnecte) {
                lienCompte.textContent = user.firstName;
            } else if (texteCommun.compte) {
                lienCompte.textContent = texteCommun.compte;
            }
        }

        // Langue & Drapeau
        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        document.getElementById("lang-dropdown").innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;

        // Menu latéral avec lien vers Connexion.html ou MonCompte.html
        if (texteCommun.menu) {
            const liens = ["location.html", "ports.html", pageCompteDestination, "historique.html", "faq.html", "avis.html"];
            const menuContent = document.getElementById("menu-links");
            menuContent.innerHTML = texteCommun.menu.map((item, index) => {
                return `<a href="${liens[index]}">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        // Paramètres URL
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get("id"));
        const categorie = params.get("categorie");

        const lienRetour = document.getElementById("lien-retour-offre");
        if (lienRetour) {
            lienRetour.href = categorie ? `offre.html?type=${encodeURIComponent(categorie)}` : "offre.html";
        }

        // Traduction des labels
        if (texte.date_debut) document.getElementById("lbl-date-debut").textContent = texte.date_debut;
        if (texte.date_fin) document.getElementById("lbl-date-fin").textContent = texte.date_fin;
        if (texte.selectLabel) document.getElementById("lbl-select-pers").innerHTML = `<strong>${texte.selectLabel}</strong>`;
        if (texte.enfantLabel) document.getElementById("lbl-enfant").textContent = texte.enfantLabel;
        if (texte.optionsTitre) document.getElementById("lbl-options-titre").textContent = texte.optionsTitre;

        const optionLabels = document.querySelectorAll('.options-bateau label');
        if (optionLabels.length > 0 && texte.skipper) document.getElementById("lbl-skipper").textContent = texte.skipper;
        if (optionLabels.length > 1 && texte.nettoyage) document.getElementById("lbl-nettoyage").textContent = texte.nettoyage;
        if (optionLabels.length > 2 && texte.literie) document.getElementById("lbl-literie").textContent = texte.literie;

        if (texte.total) document.getElementById("lbl-total").textContent = texte.total;
        if (texte.payer) document.getElementById("btn-payer").textContent = texte.payer;

        if (texte.port) document.getElementById("lbl-port").textContent = texte.port + " :";
        if (texte.personnes) document.getElementById("lbl-personnes").textContent = texte.personnes + " :";
        if (texte.cabines) document.getElementById("lbl-cabines").textContent = texte.cabines + " :";
        if (texte.longueur) document.getElementById("lbl-longueur").textContent = texte.longueur + " :";
        if (texte.prix) document.getElementById("lbl-prix").textContent = texte.prix + " :";
        if (texte.avis) document.getElementById("lbl-avis").textContent = texte.avis + " :";

        // Recherche du bateau
        const bateau = dataBateaux.find(b => b && b.id === id);

        if (bateau) {
            const { moyenne, total } = calculerMoyenneAvis(bateau.titre);
            document.getElementById("titre-bateau-label").textContent = bateau.titre;
            document.getElementById("titre-fiche").textContent = bateau.titre;
            document.getElementById("port").textContent = bateau.port || 'N/A';
            document.getElementById("personnes").textContent = bateau.personnes || 'N/A';
            document.getElementById("cabines").textContent = bateau.cabines || 'N/A';
            document.getElementById("longueur").textContent = bateau.longueur || 'N/A';
            document.getElementById("prix").textContent = bateau.prix || 'N/A';
            document.getElementById("avis").textContent = genererAvisTexte(moyenne, total);

            const lienInfoBateau = document.getElementById("lien-info-bateau");
            if (lienInfoBateau) lienInfoBateau.href = `info-bateau.html?id=${bateau.id}`;

            // Calcul du prix
            const chiffres = bateau.prix ? String(bateau.prix).match(/\d+/g) : null;
            const prixBase = chiffres ? parseInt(chiffres.join(""), 10) : 0;
            const totalPrixElem = document.getElementById("total-prix");
            totalPrixElem.textContent = prixBase + "€";

            const options = document.querySelectorAll('.option-checkbox');
            options.forEach(option => {
                option.addEventListener('change', () => {
                    let total = prixBase;
                    options.forEach(opt => {
                        if (opt.checked) {
                            total += parseInt(opt.getAttribute("data-prix"), 10);
                        }
                    });
                    totalPrixElem.textContent = total + "€";
                });
            });

            // Sélecteur personnes max
            const nbPersonnesMatch = bateau.personnes ? String(bateau.personnes).match(/\d+/) : null;
            const nbPersonnesMax = nbPersonnesMatch ? parseInt(nbPersonnesMatch[0], 10) : 1;
            regenererOptionsPersonnes(nbPersonnesMax, texte);

            // Événement du bouton Payer
            document.getElementById("btn-payer").addEventListener("click", () => {
                payer(bateau, texte);
            });
        } else {
            console.error(`Bateau avec ID ${id} non trouvé.`);
            document.getElementById("titre-fiche").textContent = "Bateau non trouvé";
            document.getElementById("port").textContent = '-';
            document.getElementById("avis").textContent = '-';
        }
    });

    function regenererOptionsPersonnes(nbMax, texte) {
        const select = document.getElementById("select-personnes");
        if (!select) return;

        select.innerHTML = "";

        const defaultOption = document.createElement("option");
        defaultOption.disabled = true;
        defaultOption.selected = true;
        defaultOption.textContent = texte.choisirNombre || "Choisir...";
        select.appendChild(defaultOption);

        for (let i = 1; i <= nbMax; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = i + (i === 1 ? (texte.personneSingulier || " personne") : (texte.personnePluriel || " personnes"));
            select.appendChild(option);
        }
    }

    function payer(bateau, texte) {
        const dateDebut = document.getElementById("date_debut").value;
        const dateFin = document.getElementById("date_fin").value;
        const selectPers = document.getElementById("select-personnes");
        const erreurNbPersonnes = document.getElementById("erreur-nb-personnes");

        if (!dateDebut || !dateFin) {
            alert(texte.champsObligatoires || (getLangue() === "en" ? "Please select departure and return dates." : "Veuillez sélectionner les dates de départ et de retour."));
            return;
        }

        if (!selectPers || !selectPers.value || selectPers.selectedIndex === 0) {
            erreurNbPersonnes.style.display = "block";
            return;
        } else {
            erreurNbPersonnes.style.display = "none";
        }

        let historique = JSON.parse(localStorage.getItem("historique") || "[]");
        const dejaReserve = historique.some(h => Number(h.id) === Number(bateau.id));

        if (!dejaReserve) {
            const optionsChoisies = [];
            document.querySelectorAll(".option-checkbox:checked").forEach(opt => {
                optionsChoisies.push(opt.value);
            });

            const reservation = {
                ...bateau,
                date_debut: dateDebut,
                date_fin: dateFin,
                personnes_choisies: selectPers.value,
                enfant_a_bord: document.getElementById("enfant-checkbox").checked,
                options: optionsChoisies
            };

            historique.push(reservation);
            localStorage.setItem("historique", JSON.stringify(historique));

            alert(texte.merci || (getLangue() === "en" ? "Thank you for your reservation!" : "Merci pour votre réservation !"));
            window.location.href = "historique.html";
        } else {
            alert(texte.dejaReserve || (getLangue() === "en" ? "You have already reserved this boat." : "Vous avez déjà réservé ce bateau."));
        }
    }
</script>
</body>
</html>
