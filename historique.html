<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Historique</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="historique.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
</head>
<body style="background-color: #c5d8d3; display: flex; flex-direction: column; min-height: 100vh;">

<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo-transparent.png" alt="Logo">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-page" style="color: #577550">Historique</h1>
    </div>
</div>

<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a href="a-propos.html" id="lien-apropos" style="color: #577550; text-decoration: none;">À propos</a>
    <a id="lien-compte" href="Connexion.html" style="color: #577550; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html"><img src="images/panier.png" alt="Panier"></a>
</div>

<!-- Conteneur principal flexible -->
<main style="flex: 1; margin-top: 140px; padding-bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center;">
    <div id="historique-container" style="width: 100%; max-width: 600px; padding: 0 20px;"></div>
    <button id="btn-vider" onclick="viderHistorique()" style="display: none; margin-top: 25px; padding: 10px 20px; background-color: #f29066; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;"></button>
</main>

<div class="bouton-bas" style="background: transparent; padding: 20px 0;">
    <a href="MentionsLegales.html" id="lien-mentions" class="bottom-text">Mentions légales</a>
    <span class="bottom-text">•</span>
    <a href="Contact.html" id="lien-contact" class="bottom-text">Contact</a>
</div>

<script>
    function toggleMenu() {
        document.getElementById("menu-overlay").classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    function getLangue() {
        return localStorage.getItem("langue") || "fr";
    }

    document.addEventListener("DOMContentLoaded", function () {
        const langue = getLangue();
        const texteCommun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});

        document.title = langue === "en" ? "History" : "Historique";
        document.getElementById("titre-page").textContent = langue === "en" ? "History" : "Historique";

        if (texteCommun.info) document.getElementById("lien-apropos").textContent = texteCommun.info;
        if (texteCommun.mentions) document.getElementById("lien-mentions").textContent = texteCommun.mentions;
        if (texteCommun.contact) document.getElementById("lien-contact").textContent = texteCommun.contact;

        // Utilisateur connecté
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const lienCompte = document.getElementById("lien-compte");
        if (lienCompte) {
            if (user && user.firstName) {
                lienCompte.textContent = user.firstName;
                lienCompte.setAttribute("href", "MonCompte.html");
            } else if (texteCommun.compte) {
                lienCompte.textContent = texteCommun.compte;
                lienCompte.setAttribute("href", "Connexion.html");
            }
        }

        // Menu overlay avec bon nom de fichier (avis.html en minuscule)
        if (texteCommun.menu) {
            const menuContent = document.getElementById("menu-links");
            const liens = ["location", "ports", "MonCompte", "historique", "faq", "avis"];
            menuContent.innerHTML = texteCommun.menu.map((item, index) => {
                return `<a href="${liens[index]}.html">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        // Gestion drapeaux
        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        document.getElementById("lang-dropdown").innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;

        afficherHistorique(langue);
    });

    function afficherHistorique(langue) {
        const container = document.getElementById("historique-container");
        const btnVider = document.getElementById("btn-vider");
        const historique = JSON.parse(localStorage.getItem("historique") || "[]");
        const avisList = JSON.parse(localStorage.getItem("avis") || "[]");

        btnVider.textContent = langue === "en" ? "Clear History" : "Vider l'historique";

        if (historique.length === 0) {
            container.innerHTML = `<p style="text-align: center; font-size: 1.1em; color: #333;">${langue === "en" ? "No reservations in history." : "Aucune réservation dans l'historique."}</p>`;
            btnVider.style.display = "none";
            return;
        }

        btnVider.style.display = "inline-block";
        container.innerHTML = historique.map((b) => {
            const avis = avisList.find(a => a.titre === b.titre) || null;
            return `
                <div class="carte-bateau" style="background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                    <h2 style="color: #333; margin-top: 0;">${b.titre}</h2>
                    <p><strong>Port :</strong> ${b.port || 'N/A'}</p>
                    <p><strong>${langue === "en" ? "Max people" : "Personnes max"} :</strong> ${b.personnes || 'N/A'}</p>
                    <p><strong>${langue === "en" ? "Cabins" : "Cabines"} :</strong> ${b.cabines || 'N/A'}</p>
                    <p><strong>${langue === "en" ? "Length" : "Longueur"} :</strong> ${b.longueur || 'N/A'}</p>
                    <p><strong>${langue === "en" ? "Price" : "Prix"} :</strong> ${b.prix || 'N/A'}</p>
                    ${b.image1 ? `<img src="${b.image1}" alt="${b.titre}" style="width: 100%; border-radius: 8px; margin: 10px 0;">` : ''}

                    <div style="background: #f9f9f9; padding: 12px; border-radius: 8px; margin-top: 10px;">
                        ${avis ? `
                            <p style="margin: 0;"><strong>Commentaire :</strong> ${avis.commentaire}</p>
                            <p style="margin: 5px 0;"><strong>Note :</strong> ${'⭐'.repeat(avis.etoiles)}</p>
                            <p style="margin: 0; font-size: 0.85em; color: #777;"><em>Posté le ${avis.date || 'N/A'}</em></p>
                        ` : `
                            <p style="margin: 0; color: #666;"><em>${langue === "en" ? "No review submitted yet." : "Aucun avis déposé."}</em></p>
                        `}
                    </div>
                </div>
            `;
        }).join('');
    }

    function viderHistorique() {
        const langue = getLangue();
        if (confirm(langue === "en" ? "Are you sure you want to clear your history?" : "Voulez-vous vraiment vider votre historique ?")) {
            localStorage.removeItem("historique");
            location.reload();
        }
    }
</script>
</body>
</html>
