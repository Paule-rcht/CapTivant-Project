<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Offres</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="offre.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
</head>
<body style="background-color: #c5d8d3;">

<!-- Menu -->
<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<!-- En-tête -->
<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo-transparent.png" alt="Logo" style="width: 30px;">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-page">Offres</h1>
    </div>
</div>

<!-- Liens à droite -->
<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="a-propos-link" href="a-propos.html" style="color: #577550; text-decoration: none;">À propos</a>
    <a id="compte-link" href="Connexion.html" style="color: #577550; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<!-- Carrousel -->
<div class="double-carrousel" id="carrousel-container"></div>

<!-- Pied de page -->
<div class="bouton-bas">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color : #577550;">Mentions légales</a>
    <span class="bottom-text" style="color: #577550;">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #577550;">Contact</a>
</div>

<script>
    function toggleMenu() {
        const menu = document.getElementById("menu-overlay");
        menu.classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    function getLangue() {
        return localStorage.getItem("langue") || "fr";
    }

    document.addEventListener("click", function(event) {
        const dropdown = document.getElementById("lang-dropdown");
        const icon = document.getElementById("current-lang");
        if (!dropdown.contains(event.target) && !icon.contains(event.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        const langue = getLangue();
        const texte = langue === "en" ? (typeof OffreEN !== "undefined" ? OffreEN : {}) : (typeof OffreFR !== "undefined" ? OffreFR : {});
        const commun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});
        const bateauxData = langue === "en" ? (typeof bateauxEN !== "undefined" ? bateauxEN : []) : (typeof bateaux !== "undefined" ? bateaux : []);

        if (texte.titre) {
            document.getElementById("page-title").textContent = texte.titre;
            document.getElementById("titre-page").textContent = texte.titre;
        }
        if (commun.mentions) document.getElementById("lien-mentions").textContent = commun.mentions;
        if (commun.contact) document.getElementById("lien-contact").textContent = commun.contact;
        if (commun.info) document.getElementById("a-propos-link").textContent = commun.info;

        // Gestion Compte / Utilisateur connecté
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const lienCompte = document.getElementById("compte-link");
        if (lienCompte) {
            if (user && user.firstName) {
                lienCompte.textContent = user.firstName;
                lienCompte.setAttribute("href", "MonCompte.html");
            } else if (commun.compte) {
                lienCompte.textContent = commun.compte;
                lienCompte.setAttribute("href", "Connexion.html");
            }
        }

        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        document.getElementById("lang-dropdown").innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" onclick="changerLangue('en')">`;

        if (commun.menu) {
            const liens = ["location", "ports", "MonCompte", "historique", "faq", "avis"];
            const menuContent = document.getElementById("menu-links");
            menuContent.innerHTML = commun.menu.map((item, index) => {
                return `<a href="${liens[index]}.html">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        // Filtrage dynamique selon l'URL
        const params = new URLSearchParams(window.location.search);
        const portParam = params.get('port');
        const typeParam = params.get('type');
        const nbPersonnes = params.get('personnes');
        const container = document.getElementById('carrousel-container');

        let filteredBateaux = bateauxData;

        // Filtre sur le nombre de personnes
        if (nbPersonnes) {
            filteredBateaux = filteredBateaux.filter(b => parseInt(b.personnes) >= parseInt(nbPersonnes));
        }

        // Filtre sur le port
        if (portParam) {
            filteredBateaux = filteredBateaux.filter(b => b.port && b.port.toLowerCase() === portParam.toLowerCase());
        }

        // Filtre sur le type (moteur / voile)
        if (typeParam === "moteur" || typeParam === "voile") {
            filteredBateaux = filteredBateaux.filter(b => (b.categorie === typeParam || b.type === typeParam));
        }

        filteredBateaux.forEach((bateau, index) => {
            const div = document.createElement("div");
            div.className = `carrousel ${bateau.categorie || bateau.type}`;
            div.setAttribute('data-id', index);
            div.innerHTML = `
                <button class="prev" onclick="changeSlide(this, -1)">❮</button>
                <div class="slides">
                    <a href="info-bateau.html?id=${bateau.id}">
                        <img src="${bateau.image1}" class="slide active">
                        ${bateau.image2 ? `<img src="${bateau.image2}" class="slide">` : ''}
                        <div class="background">
                            <a class="description">${bateau.port}, ${bateau.personnes}, ${bateau.longueur}</a>
                            <div class="ligne-info">
                                <p class="description" style="color: #000000"><strong>${bateau.prix}</strong></p>
                            </div>
                        </div>
                    </a>
                </div>
                <button class="next" onclick="changeSlide(this, 1)">❯</button>
            `;
            container.appendChild(div);
        });

        if (filteredBateaux.length === 0) {
            container.innerHTML = `<p style='text-align:center; font-size:1.2em; margin-top: 50px;'>${texte.aucunBateau || 'Aucun bateau trouvé pour ce filtre.'}</p>`;
        }
    });

    const carrouselIndexes = new Map();
    function changeSlide(button, direction) {
        const carrousel = button.closest('.carrousel');
        const slides = carrousel.querySelectorAll('.slide');

        if (!carrouselIndexes.has(carrousel)) {
            carrouselIndexes.set(carrousel, 0);
        }

        let currentIndex = carrouselIndexes.get(carrousel);
        slides[currentIndex].classList.remove('active');

        currentIndex = (currentIndex + direction + slides.length) % slides.length;

        slides[currentIndex].classList.add('active');
        carrouselIndexes.set(carrousel, currentIndex);
    }
</script>
</body>
</html>
