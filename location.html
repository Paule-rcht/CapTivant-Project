<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Location</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="location.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
    <script src="ports-info.js" defer></script>
</head>
<body style="background-color: #c5d8d3;">

<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="a-propos-link" href="a-propos.html" class="top-infos" style="color: #e0e0d5; text-decoration: none;">À propos</a>
    <a id="lien-compte" href="Connexion.html" style="color: #e0e0d5; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo.png" alt="Logo">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-page" style="color: #e0e0d5"></h1>
    </div>

    <div class="formulaire-connexion">
        <div class="background">
            <div class="champ-double" style="gap: 20px">
                <div class="champ-date">
                    <label for="départ" id="depart"></label>
                    <input type="date" id="départ">
                </div>
                <div class="champ-date">
                    <label for="arrivée" id="arrive"></label>
                    <input type="date" id="arrivée">
                </div>
            </div>
            <div class="champ-trois">
                <button type="button" class="bouton-type" id="btn-moteur" onclick="selectType(this)"></button>
                <button type="button" class="bouton-type" id="btn-voile" onclick="selectType(this)"></button>
            </div>
            <div class="champ-double" style="gap: 20px; position: relative;">
                <div class="champ-date" style="position: relative;">
                    <input type="text" id="lieu" placeholder="" autocomplete="off">
                    <div id="suggestions-lieu" class="suggestions-box"></div>
                </div>
                <div class="champ-date">
                    <input type="number" id="personnes" placeholder="" min="1">
                </div>
            </div>

            <div class="champ" style="padding: 22px;">
                <br>
                <button type="button" id="lien-recherche" class="connexion" onclick="verifierEtRediriger()" style="border: none; cursor: pointer;">Rechercher</button>
            </div>
        </div>
    </div>
</div>

<div class="bouton-bas" style="background: transparent">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text">Mentions légales</a>
    <span class="bottom-text">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text">Contact</a>
</div>

<script>
    function toggleMenu() {
        document.getElementById("menu-overlay").classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    function getLangue() {
        return localStorage.getItem("langue") || "fr";
    }

    document.addEventListener("click", function(event) {
        const dropdown = document.getElementById("lang-dropdown");
        const icon = document.getElementById("current-lang");
        if (dropdown && icon && !dropdown.contains(event.target) && !icon.contains(event.target)) {
            dropdown.style.display = "none";
        }

        const suggestionsBox = document.getElementById("suggestions-lieu");
        const lieuInput = document.getElementById("lieu");
        if (suggestionsBox && lieuInput && !lieuInput.contains(event.target)) {
            suggestionsBox.innerHTML = "";
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        const langue = getLangue();
        const texte = langue === "en" ? (typeof LocationEN !== "undefined" ? LocationEN : {}) : (typeof LocationFR !== "undefined" ? LocationFR : {});
        const commun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});

        if (texte.titre) {
            document.getElementById("page-title").textContent = texte.titre;
            document.getElementById("titre-page").textContent = texte.titre;
        }
        if (texte.depart) document.getElementById("depart").textContent = texte.depart;
        if (texte.arrive) document.getElementById("arrive").textContent = texte.arrive;
        if (texte.lieu) document.getElementById("lieu").placeholder = texte.lieu;
        if (texte.personnes) document.getElementById("personnes").placeholder = texte.personnes;
        if (texte.moteur) document.getElementById("btn-moteur").textContent = texte.moteur;
        if (texte.voile) document.getElementById("btn-voile").textContent = texte.voile;
        if (texte.recherche) document.getElementById("lien-recherche").textContent = texte.recherche;

        if (commun.mentions) document.getElementById("lien-mentions").textContent = commun.mentions;
        if (commun.contact) document.getElementById("lien-contact").textContent = commun.contact;
        if (commun.info) document.getElementById("a-propos-link").textContent = commun.info;

        // Statut utilisateur connecté & redirection dynamique
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const estConnecte = user && user.firstName;
        const pageCompteDestination = estConnecte ? "MonCompte.html" : "Connexion.html";

        const lienCompte = document.getElementById("lien-compte");
        if (lienCompte) {
            lienCompte.setAttribute("href", pageCompteDestination);
            if (estConnecte) {
                lienCompte.textContent = user.firstName;
            } else if (commun.compte) {
                lienCompte.textContent = commun.compte;
            }
        }

        // Drapeau et sélecteur
        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        document.getElementById("lang-dropdown").innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;

        // Génération du menu de navigation
        if (commun.menu) {
            const liens = ["location.html", "ports.html", pageCompteDestination, "historique.html", "faq.html", "avis.html"];
            const menuContent = document.getElementById("menu-links");
            menuContent.innerHTML = commun.menu.map((item, index) => {
                return `<a href="${liens[index]}">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        // Configuration autocomplétion lieux
        const lieuInput = document.getElementById("lieu");
        if (lieuInput) {
            lieuInput.addEventListener("input", function () {
                const input = this.value.toLowerCase();
                const suggestionsBox = document.getElementById("suggestions-lieu");
                suggestionsBox.innerHTML = "";

                if (typeof ports !== "undefined" && Array.isArray(ports)) {
                    const suggestions = input === ""
                        ? ports
                        : ports.filter(port => port.name.toLowerCase().startsWith(input));

                    suggestions.forEach(port => {
                        const div = document.createElement("div");
                        div.textContent = port.name;
                        div.style.padding = "8px";
                        div.style.cursor = "pointer";
                        div.onclick = function () {
                            document.getElementById("lieu").value = port.name;
                            suggestionsBox.innerHTML = "";
                        };
                        suggestionsBox.appendChild(div);
                    });
                }
            });
        }
    });

    let typeSelectionne = "";
    function selectType(button) {
        if (button.classList.contains("active")) {
            button.classList.remove("active");
            typeSelectionne = "";
        } else {
            document.querySelectorAll('.bouton-type').forEach(btn => btn.classList.remove('active'));
            button.classList.add("active");

            if (button.id === "btn-moteur") {
                typeSelectionne = "moteur";
            } else if (button.id === "btn-voile") {
                typeSelectionne = "voile";
            }
        }
    }

    function verifierEtRediriger() {
        const depart = document.getElementById("départ").value;
        const arrivee = document.getElementById("arrivée").value;
        const lieu = document.getElementById("lieu").value.trim();
        const personnes = document.getElementById("personnes").value.trim();

        let url = "offre.html?";
        if (lieu !== "") {
            url += `port=${encodeURIComponent(lieu)}&`;
        }
        if (typeSelectionne) {
            url += `type=${typeSelectionne}&`;
        }
        if (personnes !== "") {
            url += `personnes=${encodeURIComponent(personnes)}&`;
        }

        url += `depart=${depart}&arrivee=${arrivee}`;
        window.location.href = url;
    }
</script>
</body>
</html>
