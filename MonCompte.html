<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Mon Compte</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="MonCompte.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
</head>
<body style="background-color: #c5d8d3;">

<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="a-propos-link" href="a-propos.html" style="color: #577550; text-decoration: none;">À propos</a>
    <a id="mon-compte-link" href="MonCompte.html" style="color: #577550; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo-transparent.png" alt="Logo">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-page">Mon Compte</h1>
    </div>

    <p id="message-statut" style="text-align: center; font-weight: bold; display: none; margin-top: 10px;"></p>

    <form onsubmit="enregistrerModifications(event)" class="formulaire-connexion">
        <div class="champ-msg" style="margin-top: 40px;">
            <label id="label-infos" for="nom">Mes informations</label>
            <label id="label-adresse" for="rue">Mon adresse</label>
        </div>
        <div class="champ-double">
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="text" id="rue" placeholder="Rue">
        </div>
        <div class="champ-double">
            <input type="text" id="prenom" placeholder="Prénom" required>
            <input type="text" id="code-postal" placeholder="Code postal">
        </div>
        <div class="champ-double">
            <input type="email" id="mail" placeholder="E-mail" required>
            <input type="text" id="ville" placeholder="Ville">
        </div>
        <div class="champ-double">
            <input type="text" id="telephone" placeholder="Numéro de téléphone">
            <input type="text" id="pays" placeholder="Pays">
        </div>

        <div style="text-align: center; margin-top: 20px; font-size: 20px;">
            <button type="submit" class="connexion" id="btn-modifier" style="border: none; cursor: pointer;">Modifier</button>
        </div>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <button type="button" onclick="seDeconnecter()" style="color: #ee9c72; font-family: 'DM Serif Display', cursive; cursor: pointer; background: none; border: none; outline: none; font-size: 20px;" id="btn-deconnexion">Se déconnecter</button>
    </div>
</div>

<div class="bouton-bas">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color: #577550">Mentions légales</a>
    <span class="bottom-text" style="color: #577550">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #577550">Contact</a>
</div>

<script>
    function toggleMenu() {
        const menu = document.getElementById("menu-overlay");
        menu.classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    function getLangue() {
        return localStorage.getItem("langue") || "fr";
    }

    document.addEventListener("click", function(event) {
        const dropdown = document.getElementById("lang-dropdown");
        const icon = document.getElementById("current-lang");
        if (dropdown && icon && !dropdown.contains(event.target) && !icon.contains(event.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        // Redirection vers connexion si déconnecté
        const user = JSON.parse(localStorage.getItem("user") || "null") || JSON.parse(localStorage.getItem("userData") || "null");
        if (!user || (!user.firstName && !user.prenom)) {
            window.location.href = "Connexion.html";
            return;
        }

        const langue = getLangue();
        const texte = langue === "en" ? (typeof CompteEN !== "undefined" ? CompteEN : {}) : (typeof CompteFR !== "undefined" ? CompteFR : {});
        const commun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});

        if (texte.titre) {
            document.getElementById("page-title").textContent = texte.titre;
            document.getElementById("titre-page").textContent = texte.titre;
        }
        if (texte.labelInfos) document.getElementById("label-infos").textContent = texte.labelInfos;
        if (texte.labelAdresse) document.getElementById("label-adresse").textContent = texte.labelAdresse;

        if (texte.nom) document.getElementById("nom").placeholder = texte.nom;
        if (texte.prenom) document.getElementById("prenom").placeholder = texte.prenom;
        if (texte.email) document.getElementById("mail").placeholder = texte.email;
        if (texte.codePostal) document.getElementById("code-postal").placeholder = texte.codePostal;
        if (texte.ville) document.getElementById("ville").placeholder = texte.ville;
        if (texte.telephone) document.getElementById("telephone").placeholder = texte.telephone;
        if (texte.rue) document.getElementById("rue").placeholder = texte.rue;
        if (texte.pays) document.getElementById("pays").placeholder = texte.pays;
        if (texte.bouton) document.getElementById("btn-modifier").textContent = texte.bouton;
        if (texte.deconnexion) document.getElementById("btn-deconnexion").textContent = texte.deconnexion;

        if (commun.mentions) document.getElementById("lien-mentions").textContent = commun.mentions;
        if (commun.contact) document.getElementById("lien-contact").textContent = commun.contact;
        if (commun.info) document.getElementById("a-propos-link").textContent = commun.info;

        // Statut Utilisateur en haut à droite
        const monCompteLink = document.getElementById("mon-compte-link");
        if (monCompteLink) {
            monCompteLink.textContent = user.firstName || user.prenom;
            monCompteLink.setAttribute("href", "MonCompte.html");
        }

        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        const langDropdown = document.getElementById("lang-dropdown");
        langDropdown.innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;

        // Génération du menu de navigation
        if (commun.menu) {
            const liens = ["location.html", "ports.html", "MonCompte.html", "historique.html", "faq.html", "avis.html"];
            const menuContent = document.getElementById("menu-links");
            menuContent.innerHTML = commun.menu.map((item, index) => {
                return `<a href="${liens[index]}">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        // Charger les informations enregistrées
        chargerUser(user);
    });

    function chargerUser(user) {
        if (user) {
            if (user.lastName || user.nom) document.getElementById("nom").value = user.lastName || user.nom;
            if (user.firstName || user.prenom) document.getElementById("prenom").value = user.firstName || user.prenom;
            if (user.email) document.getElementById("mail").value = user.email;
            if (user.phone || user.telephone) document.getElementById("telephone").value = user.phone || user.telephone;
            if (user.street || user.rue) document.getElementById("rue").value = user.street || user.rue;
            if (user.postalCode || user.codePostal) document.getElementById("code-postal").value = user.postalCode || user.codePostal;
            if (user.city || user.ville) document.getElementById("ville").value = user.city || user.ville;
            if (user.country || user.pays) document.getElementById("pays").value = user.country || user.pays;
        }
    }

    function enregistrerModifications(event) {
        event.preventDefault();

        const user = {
            lastName: document.getElementById("nom").value.trim(),
            firstName: document.getElementById("prenom").value.trim(),
            email: document.getElementById("mail").value.trim(),
            phone: document.getElementById("telephone").value.trim(),
            street: document.getElementById("rue").value.trim(),
            postalCode: document.getElementById("code-postal").value.trim(),
            city: document.getElementById("ville").value.trim(),
            country: document.getElementById("pays").value.trim()
        };

        localStorage.setItem("user", JSON.stringify(user));

        const msgStatut = document.getElementById("message-statut");
        const langue = getLangue();
        msgStatut.textContent = langue === "en" ? "Information updated successfully." : "Informations mises à jour avec succès.";
        msgStatut.style.color = "green";
        msgStatut.style.display = "block";
    }

    function seDeconnecter() {
        localStorage.removeItem("user");
        localStorage.removeItem("userData");
        window.location.href = "Connexion.html";
    }
</script>
</body>
</html>
