<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Cap'Tivant - Accueil</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        /* Bouton unique du guide vocal */
        #audio-guide-control {
            position: fixed;
            right: 20px;
            bottom: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 2px solid #577550;
        }

        #audio-guide-control:hover {
            background: #ffffff;
            transform: scale(1.1);
        }

        #audio-guide-control::after {
            content: attr(data-tooltip);
            position: absolute;
            right: 65px;
            top: 50%;
            transform: translateY(-50%);
            background: #333;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-family: Arial, sans-serif;
        }

        #audio-guide-control:hover::after {
            opacity: 1;
        }

        /* Pied de page sans barre opaque */
        .bottom-center {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 900;
        }
    </style>
</head>
<body>

<div class="background-fixe"></div>

<!-- Menu -->
<div class="top-left" onclick="toggleMenu()" data-sound-fr="interface menu.mp3" data-sound-en="interface menu.mp3">
    <img src="images/menu.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<!-- Haut de page -->
<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="a-propos-link" href="a-propos.html" class="top-infos" style="color: #e0e0d5; text-decoration: none;" data-sound-fr="a-propos.mp3" data-sound-en="about.mp3">À propos</a>
    <a id="lien-compte" href="Connexion.html" style="color: #e0e0d5; text-decoration: none;" data-sound-fr="mon compte.mp3" data-sound-en="mya account.mp3">Mon Compte</a>
    <a href="favoris.html" data-sound-fr="mon panier.mp3" data-sound-en="my favorite.mp3">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<div class="top-center">
    <a href="index.html" data-sound-fr="francais.mp3" data-sound-en="english mode.mp3">
        <img src="images/logo.png" alt="Logo">
    </a>
</div>

<!-- Accueil -->
<section class="section-accueil">
    <div class="texte-wrapper">
        <div class="texte principal" id="texte-principal" data-sound-fr="francais.mp3" data-sound-en="english mode.mp3">Cap'Tivant</div>
        <a href="location.html" class="texte secondaire" style="text-decoration: none" id="texte-secondaire" data-sound-fr="location.mp3" data-sound-en="rental.mp3">Location de bateau</a>
    </div>
</section>

<!-- Carrousel -->
<section class="section-bateau">
    <div class="bloc-bateau-carre">
        <div class="carousel">
            <div class="contenu-bateau">
                <a href="ports.html" class="carte" id="carte-link" data-sound-fr="nos ports.mp3" data-sound-en="our ports.mp3">
                    <div id="carte"></div>
                </a>
                <div class="carre-carousel-slide">
                    <div class="carre-track-slide" id="carouselTrack">
                        <a href="info-bateau.html?id=3" data-sound-fr="location a voile.mp3" data-sound-en="sailling.mp3"><img src="images/bateau-voile1.png" alt="Bateau 3"></a>
                        <a href="info-bateau.html?id=1" data-sound-fr="location.mp3" data-sound-en="rental.mp3"><img src="images/bateau1.png" alt="Bateau 1"></a>
                        <a href="info-bateau.html?id=2" data-sound-fr="location.mp3" data-sound-en="rental.mp3"><img src="images/catamaran1.png" alt="Bateau 2"></a>
                        <a href="info-bateau.html?id=4" data-sound-fr="location a moteur.mp3" data-sound-en="motor.mp3"><img src="images/moteur1.png" alt="Bateau 4"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Bouton Unique du Guide Vocal -->
<div id="audio-guide-control" data-tooltip="Activer le guide vocal">
    <span style="font-size: 22px;" id="icon-audio">📣</span>
</div>

<!-- Pied de page -->
<div class="bottom-center">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color: #e0e0d5;" data-sound-fr="mention legale.mp3" data-sound-en="legal notice.mp3">Mentions légales</a>
    <span class="bottom-text" style="color: #e0e0d5;">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #e0e0d5;" data-sound-fr="contact.mp3" data-sound-en="contact ang.mp3">Contact</a>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="info-bateau.js"></script>
<script>
    let guideVocalActif = false;
    let audioActuel = null;

    function getLangue() {
        return localStorage.getItem("langue") || "fr";
    }

    function jouerSon(nomFichier) {
        if (!guideVocalActif || !nomFichier) return;
        if (audioActuel) {
            audioActuel.pause();
            audioActuel.currentTime = 0;
        }
        audioActuel = new Audio('son/' + nomFichier);
        audioActuel.play().catch(err => console.log("Erreur audio :", err));
    }

    function toggleMenu() {
        const overlay = document.getElementById("menu-overlay");
        overlay.classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    document.addEventListener("click", function(event) {
        const dropdown = document.getElementById("lang-dropdown");
        const icon = document.getElementById("current-lang");
        if (dropdown && icon && !dropdown.contains(event.target) && !icon.contains(event.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        const langue = getLangue();
        const commun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});
        const texte = langue === "en" ? (typeof AccueilEN !== "undefined" ? AccueilEN : {}) : (typeof AccueilFR !== "undefined" ? AccueilFR : {});

        if (texte.titre) document.getElementById("page-title").textContent = texte.titre;
        if (texte.textePrincipal) document.getElementById("texte-principal").textContent = texte.textePrincipal;
        if (texte.texteSecondaire) document.getElementById("texte-secondaire").textContent = texte.texteSecondaire;

        if (commun.mentions) document.getElementById("lien-mentions").textContent = commun.mentions;
        if (commun.contact) document.getElementById("lien-contact").textContent = commun.contact;
        if (commun.info) document.getElementById("a-propos-link").textContent = commun.info;

        // Session utilisateur & redirection dynamique
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const estConnecte = user && user.firstName;
        const pageCompteDestination = estConnecte ? "MonCompte.html" : "Connexion.html";

        const lienCompte = document.getElementById("lien-compte");
        if (lienCompte) {
            lienCompte.setAttribute("href", pageCompteDestination);
            if (estConnecte) {
                lienCompte.textContent = user.firstName;
            } else if (commun.compte) {
                lienCompte.textContent = commun.compte;
            }
        }

        // Sélecteur de langue
        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        document.getElementById("lang-dropdown").innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;

        // Menu latéral dynamique
        if (commun.menu) {
            const liens = ["location.html", "ports.html", pageCompteDestination, "historique.html", "faq.html", "avis.html"];
            const menuContent = document.getElementById("menu-links");
            menuContent.innerHTML = commun.menu.map((item, index) => `<a href="${liens[index]}">${item}</a>`).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        // Animation Carrousel
        const track = document.querySelector(".carre-track-slide");
        const images = document.querySelectorAll(".carre-track-slide img");
        if (track && images.length > 0) {
            const imageWidth = 400;
            let index = 0;
            setInterval(() => {
                index = (index + 1) % images.length;
                track.style.transform = `translateX(-${index * imageWidth}px)`;
            }, 2000);
        }

        // Initialisation Carte Leaflet
        if (document.getElementById('carte')) {
            const map = L.map('carte').setView([47.2186, -1.5536], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        // Gestion du Guide Vocal (Bouton unique)
        const btnGuide = document.getElementById('audio-guide-control');
        const iconAudio = document.getElementById('icon-audio');

        btnGuide.addEventListener('click', function() {
            guideVocalActif = !guideVocalActif;
            const lg = getLangue();
            if (guideVocalActif) {
                iconAudio.textContent = '🔊';
                btnGuide.setAttribute('data-tooltip', lg === 'en' ? 'Disable voice guide' : 'Désactiver le guide vocal');
                jouerSon(lg === 'en' ? 'english mode.mp3' : 'francais.mp3');
            } else {
                iconAudio.textContent = '📣';
                btnGuide.setAttribute('data-tooltip', lg === 'en' ? 'Enable voice guide' : 'Activer le guide vocal');
                if (audioActuel) {
                    audioActuel.pause();
                }
            }
        });

        // Lecture au survol de la souris
        document.querySelectorAll('[data-sound-fr]').forEach(element => {
            element.addEventListener('mouseenter', function() {
                const lg = getLangue();
                const son = lg === 'en' ? this.getAttribute('data-sound-en') : this.getAttribute('data-sound-fr');
                jouerSon(son);
            });
        });
    });
</script>
</body>
</html>
