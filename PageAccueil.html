<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Cap'Tivant - Accueil</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body.accessibility-mode {
            font-size: 18px;
            line-height: 1.6;
        }

        body.accessibility-mode a,
        body.accessibility-mode button {
            padding: 10px;
            border: 2px solid #000;
            font-size: 16px;
        }

        body.accessibility-mode .menu-content a {
            padding: 15px;
            font-size: 20px;
        }

        #access-control, #music-control {
            position: fixed;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 2px solid #4a4a4a;
        }

        #music-control {
            bottom: 20px;
        }

        #access-control {
            bottom: 80px;
        }

        #access-control img {
            width: 24px;
            height: 24px;
        }

        #access-control:hover, #music-control:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }

        #access-control::after, #music-control::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #access-control:hover::after, #music-control:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="background-fixe"></div>

<!-- Menu -->
<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<!-- Haut de page -->
<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="a-propos-link" href="a-propos.html" class="top-infos" style="color: #e0e0d5; text-decoration: none;">À propos</a>
    <a id="lien-compte" href="Connexion.html" style="color: #e0e0d5; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<div class="top-center">
    <a href="index.html">
        <img src="images/logo.png" alt="Logo">
    </a>
</div>

<!-- Accueil -->
<section class="section-accueil">
    <div class="texte-wrapper">
        <div class="texte principal" id="texte-principal">Cap'Tivant</div>
        <a href="location.html" class="texte secondaire" style="text-decoration: none" id="texte-secondaire">Location de bateau</a>
    </div>
</section>

<!-- Carrousel -->
<section class="section-bateau">
    <div class="bloc-bateau-carre">
        <div class="carousel">
            <div class="contenu-bateau">
                <a href="ports.html" class="carte" id="carte-link">
                    <div id="carte"></div>
                </a>
                <div class="carre-carousel-slide">
                    <div class="carre-track-slide" id="carouselTrack">
                        <a href="info-bateau.html?id=3"><img src="images/bateau-voile1.png" alt="Bateau 3"></a>
                        <a href="info-bateau.html?id=1"><img src="images/bateau1.png" alt="Bateau 1"></a>
                        <a href="info-bateau.html?id=2"><img src="images/catamaran1.png" alt="Bateau 2"></a>
                        <a href="info-bateau.html?id=4"><img src="images/moteur1.png" alt="Bateau 4"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Boutons d'accessibilité et de musique -->
<div id="access-control" data-tooltip="Activer accessibilité">
    <img src="images/menu.png" alt="Accessibilité" style="filter: invert(1);">
</div>
<div id="music-control" data-tooltip="Activer la musique">🔇</div>

<!-- Audio d'ambiance optionnel -->
<audio id="background-music" loop src="audio/mer.mp3"></audio>

<!-- Pied de page -->
<div class="bottom-center">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text">Mentions légales</a>
    <span class="bottom-text">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text">Contact</a>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="info-bateau.js"></script>
<script>
    function toggleMenu() {
        const overlay = document.getElementById("menu-overlay");
        overlay.classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    function getLangue() {
        return localStorage.getItem("langue") || "fr";
    }

    function toggleAccessibility() {
        const isActive = document.body.classList.toggle('accessibility-mode');
        document.getElementById('access-control').setAttribute('data-tooltip', isActive ? 'Désactiver accessibilité' : 'Activer accessibilité');
        localStorage.setItem('accessibility_mode', isActive ? '1' : '0');
    }

    document.addEventListener("click", function(event) {
        const dropdown = document.getElementById("lang-dropdown");
        const icon = document.getElementById("current-lang");
        if (dropdown && icon && !dropdown.contains(event.target) && !icon.contains(event.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        const langue = getLangue();
        const commun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});
        const texte = langue === "en" ? (typeof AccueilEN !== "undefined" ? AccueilEN : {}) : (typeof AccueilFR !== "undefined" ? AccueilFR : {});

        // Restauration du mode accessibilité
        if (localStorage.getItem('accessibility_mode') === '1') {
            document.body.classList.add('accessibility-mode');
            document.getElementById('access-control').setAttribute('data-tooltip', 'Désactiver accessibilité');
        }

        if (texte.titre) document.getElementById("page-title").textContent = texte.titre;
        if (texte.textePrincipal) document.getElementById("texte-principal").textContent = texte.textePrincipal;
        if (texte.texteSecondaire) document.getElementById("texte-secondaire").textContent = texte.texteSecondaire;

        if (commun.mentions) document.getElementById("lien-mentions").textContent = commun.mentions;
        if (commun.contact) document.getElementById("lien-contact").textContent = commun.contact;
        if (commun.info) document.getElementById("a-propos-link").textContent = commun.info;

        // Gestion de la session utilisateur & redirection dynamique
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const estConnecte = user && user.firstName;
        const pageCompteDestination = estConnecte ? "MonCompte.html" : "Connexion.html";

        const lienCompte = document.getElementById("lien-compte");
        if (lienCompte) {
            lienCompte.setAttribute("href", pageCompteDestination);
            if (estConnecte) {
                lienCompte.textContent = user.firstName;
            } else if (commun.compte) {
                lienCompte.textContent = commun.compte;
            }
        }

        // Sélecteur de langue
        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        document.getElementById("lang-dropdown").innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;

        // Génération du menu latéral avec destination dynamique
        if (commun.menu) {
            const liens = ["location.html", "ports.html", pageCompteDestination, "historique.html", "faq.html", "avis.html"];
            const menuContent = document.getElementById("menu-links");
            menuContent.innerHTML = commun.menu.map((item, index) => `<a href="${liens[index]}">${item}</a>`).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        // Animation Carrousel
        const track = document.querySelector(".carre-track-slide");
        const images = document.querySelectorAll(".carre-track-slide img");
        if (track && images.length > 0) {
            const imageWidth = 400;
            let index = 0;
            setInterval(() => {
                index = (index + 1) % images.length;
                track.style.transform = `translateX(-${index * imageWidth}px)`;
            }, 2000);
        }

        // Initialisation de la carte Leaflet
        if (document.getElementById('carte')) {
            const map = L.map('carte').setView([47.2186, -1.5536], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        // Musique d'ambiance
        const music = document.getElementById('background-music');
        const control = document.getElementById('music-control');
        if (music && control) {
            music.volume = 0.4;

            if (localStorage.getItem('musicEnabled') === 'true') {
                music.play().catch(() => {});
                control.textContent = '🔊';
            }

            control.addEventListener('click', function () {
                if (music.paused) {
                    music.play().then(() => {
                        control.textContent = '🔊';
                        control.setAttribute('data-tooltip', langue === 'fr' ? 'Couper la musique' : 'Mute music');
                        localStorage.setItem('musicEnabled', 'true');
                    }).catch(() => {
                        alert(langue === 'fr' ? 'Cliquez sur la page pour activer le son' : 'Click on the page to enable sound');
                    });
                } else {
                    music.pause();
                    control.textContent = '🔇';
                    control.setAttribute('data-tooltip', langue === 'fr' ? 'Activer la musique' : 'Enable music');
                    localStorage.setItem('musicEnabled', 'false');
                }
            });
        }

        const accessBtn = document.getElementById('access-control');
        if (accessBtn) {
            accessBtn.addEventListener('click', toggleAccessibility);
        }
    });
</script>
</body>
</html>
