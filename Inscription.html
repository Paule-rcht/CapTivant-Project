<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Inscription</title>
    <link rel="stylesheet" href="PageAccueil.css">
    <link rel="stylesheet" href="inscription.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <script src="info-bateau.js" defer></script>
    <style>
        body {
            background-color: #c5d8d3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        main.contenu-scrollable {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 80px 20px;
            box-sizing: border-box;
        }

        .formulaire-inscription {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .champ-ligne {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .etoile-rouge {
            color: #d9534f;
            font-weight: bold;
            font-size: 1.2em;
            width: 15px;
            text-align: right;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .champ-ligne input[type="text"],
        .champ-ligne input[type="email"],
        .champ-ligne input[type="password"] {
            width: 100%;
            padding: 12px 45px 12px 16px;
            border-radius: 20px;
            border: 1px solid #ffffff;
            background-color: rgba(255, 255, 255, 0.85);
            font-size: 0.95em;
            outline: none;
            box-sizing: border-box;
            color: #333;
        }

        .icone-centree {
            display: block;
            margin: 10px auto 4px auto;
            height: 24px;
            width: auto;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            user-select: none;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .toggle-password-btn:hover {
            opacity: 1;
        }

        /* Captcha Styles */
        .captcha-box {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            padding: 12px 16px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .captcha-challenge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'DM Serif Display', serif;
            color: #335533;
            font-size: 1.05em;
        }

        .captcha-question {
            background: #e8f0ec;
            padding: 4px 12px;
            border-radius: 8px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .btn-refresh-captcha {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
        }

        .conditions-block {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #335533;
            margin-top: 5px;
        }

        .btn-inscription-submit {
            background-color: #577550;
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-family: 'DM Serif Display', serif;
            font-size: 1.1em;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s ease;
        }

        .btn-inscription-submit:hover {
            background-color: #445d3e;
        }

        .bouton-bas {
            position: relative;
            bottom: 0;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background-color: transparent;
        }
    </style>
</head>
<body>

<div class="top-left" onclick="toggleMenu()">
    <img src="images/menu-vert.png" alt="Menu">
</div>

<div id="menu-overlay" class="menu-overlay">
    <div class="menu-content" id="menu-links"></div>
</div>

<div class="top-right">
    <div class="language-selector">
        <img id="current-lang" src="images/drapeau-francais.png" alt="Langue" onclick="toggleLangDropdown()" class="drapeau-icon" style="cursor: pointer;">
        <div id="lang-dropdown" class="lang-dropdown"></div>
    </div>
    <a id="a-propos-link" href="a-propos.html" style="color: #577550; text-decoration: none;">À propos</a>
    <a id="mon-compte-link" href="Connexion.html" style="color: #577550; text-decoration: none;">Mon Compte</a>
    <a href="favoris.html">
        <img src="images/panier.png" alt="Panier">
    </a>
</div>

<div class="top-center">
    <div class="logo-block">
        <a href="PageAccueil.html">
            <img src="images/logo-transparent.png" alt="Logo" style="width: 30px;">
        </a>
        <p class="logo-slogan">Cap'Tivant</p>
        <h1 class="page-title" id="titre-page">Inscription</h1>
    </div>
</div>

<main class="contenu-scrollable">
    <form onsubmit="traiterInscription(event)" class="formulaire-inscription">

        <div class="champ-ligne">
            <span class="etoile-rouge">*</span>
            <input type="text" id="nom" placeholder="Nom" required>
        </div>

        <div class="champ-ligne">
            <span class="etoile-rouge">*</span>
            <input type="text" id="prenom" placeholder="Prénom" required>
        </div>

        <img src="images/email.png" alt="email" class="icone-centree">

        <div class="champ-ligne">
            <span class="etoile-rouge">*</span>
            <input type="email" id="email" placeholder="Entrez votre adresse mail" required>
        </div>

        <img src="images/mdp.png" alt="mot de passe" class="icone-centree">

        <div class="champ-ligne">
            <span class="etoile-rouge">*</span>
            <input type="password" id="mdp" placeholder="Entrez votre mot de passe" required>
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('mdp', this)" title="Afficher/Masquer le mot de passe">🙈</button>
        </div>

        <div class="champ-ligne">
            <span class="etoile-rouge">*</span>
            <input type="password" id="mdp-confirm" placeholder="Confirmez votre mot de passe" required>
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('mdp-confirm', this)" title="Afficher/Masquer le mot de passe">🙈</button>
        </div>

        <!-- Section Captcha -->
        <div class="captcha-box">
            <div class="captcha-challenge">
                <span id="label-captcha">Sécurité Captcha :</span>
                <div>
                    <span id="captcha-question" class="captcha-question">...</span>
                    <button type="button" class="btn-refresh-captcha" onclick="genererCaptcha()" title="Changer de question">🔄</button>
                </div>
            </div>
            <div class="champ-ligne">
                <span class="etoile-rouge">*</span>
                <input type="text" id="captcha-answer" placeholder="Résultat du calcul" required autocomplete="off">
            </div>
        </div>

        <div class="conditions-block" style="margin-top: 10px;">
            <span class="etoile-rouge">*</span>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="mentions" required>
                <span id="conditions-text">Accepter les conditions d'utilisations</span>
            </label>
        </div>

        <div class="conditions-block">
            <span class="etoile-rouge" style="visibility: hidden;">*</span>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="newsletter">
                <span id="newsletter-text">Je souhaite m'inscrire à la newsletter</span>
            </label>
        </div>

        <button type="submit" class="btn-inscription-submit" id="btn-inscription">S'inscrire</button>

    </form>

    <p id="error-message" style="color: #d9534f; text-align: center; display: none; margin-top: 12px; font-weight: bold;"></p>

    <div style="text-align: center; margin-top: 15px;">
        <a href="Connexion.html" id="lien-connexion" style="color: #ee9c72; text-decoration: none; font-weight: bold; font-family: 'DM Serif Display', serif; font-size: 1.1em;">Se connecter</a>
    </div>

    <div class="conditions-block" style="margin-top: 10px; font-size: 0.85em; opacity: 0.8;">
        <span class="etoile-rouge">*</span>
        <span id="champs">Ce champ est obligatoire</span>
    </div>
</main>

<div class="bouton-bas">
    <a id="lien-mentions" href="MentionsLegales.html" class="bottom-text" style="color: #577550">Mentions légales</a>
    <span class="bottom-text" style="color: #577550">•</span>
    <a id="lien-contact" href="Contact.html" class="bottom-text" style="color: #577550">Contact</a>
</div>

<script>
    let reponseCaptcha = 0;

    function genererCaptcha() {
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        reponseCaptcha = num1 + num2;
        document.getElementById("captcha-question").textContent = `${num1} + ${num2} = ?`;
        document.getElementById("captcha-answer").value = "";
    }

    function toggleMenu() {
        const menu = document.getElementById("menu-overlay");
        menu.classList.toggle("active");
    }

    function toggleLangDropdown() {
        const dropdown = document.getElementById("lang-dropdown");
        dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    function changerLangue(langue) {
        localStorage.setItem("langue", langue);
        location.reload();
    }

    document.addEventListener("click", function(event) {
        const dropdown = document.getElementById("lang-dropdown");
        const icon = document.getElementById("current-lang");
        if (dropdown && icon && !dropdown.contains(event.target) && !icon.contains(event.target)) {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("DOMContentLoaded", function () {
        genererCaptcha();

        const langue = localStorage.getItem("langue") || "fr";
        const texte = langue === "en" ? (typeof InscriptionEN !== "undefined" ? InscriptionEN : {}) : (typeof InscriptionFR !== "undefined" ? InscriptionFR : {});
        const commun = langue === "en" ? (typeof CommunEN !== "undefined" ? CommunEN : {}) : (typeof CommunFR !== "undefined" ? CommunFR : {});

        if (texte.titre) {
            document.title = texte.titre;
            document.getElementById("page-title").textContent = texte.titre;
            document.getElementById("titre-page").textContent = texte.titre;
        }

        if (texte.nom) document.getElementById("nom").placeholder = texte.nom;
        if (texte.prenom) document.getElementById("prenom").placeholder = texte.prenom;
        if (texte.email) document.getElementById("email").placeholder = texte.email;
        if (texte.mdp) document.getElementById("mdp").placeholder = texte.mdp;
        if (texte.confirmerMdp) document.getElementById("mdp-confirm").placeholder = texte.confirmerMdp;
        if (texte.conditions) document.getElementById("conditions-text").textContent = texte.conditions;
        if (texte.bouton) document.getElementById("btn-inscription").textContent = texte.bouton;
        if (texte.lienConnexion) document.getElementById("lien-connexion").textContent = texte.lienConnexion;
        if (texte.champs) document.getElementById("champs").textContent = texte.champs;
        if (texte.newsletter) document.getElementById("newsletter-text").textContent = texte.newsletter;

        if (commun.mentions) document.getElementById("lien-mentions").textContent = commun.mentions;
        if (commun.contact) document.getElementById("lien-contact").textContent = commun.contact;
        if (commun.info) document.getElementById("a-propos-link").textContent = commun.info;

        // Session utilisateur & redirection
        const user = JSON.parse(localStorage.getItem("user") || "null");
        const estConnecte = user && user.firstName;
        const pageCompteDestination = estConnecte ? "MonCompte.html" : "Connexion.html";

        const monCompteLink = document.getElementById("mon-compte-link");
        if (monCompteLink) {
            monCompteLink.setAttribute("href", pageCompteDestination);
            if (estConnecte) {
                monCompteLink.textContent = user.firstName;
            } else if (commun.compte) {
                monCompteLink.textContent = commun.compte;
            }
        }

        // Menu latéral
        if (commun.menu) {
            const menuContent = document.getElementById("menu-links");
            const liens = ["location.html", "ports.html", pageCompteDestination, "historique.html", "faq.html", "avis.html"];
            menuContent.innerHTML = commun.menu.map((item, index) => {
                return `<a href="${liens[index]}">${item}</a>`;
            }).join('') + '<span onclick="toggleMenu()" class="close-menu">✕</span>';
        }

        document.getElementById("current-lang").src = langue === "en" ? "images/drapeau-anglais.png" : "images/drapeau-francais.png";
        const langDropdown = document.getElementById("lang-dropdown");
        langDropdown.innerHTML = langue === "en"
            ? `<img src="images/drapeau-francais.png" alt="Français" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('fr')">`
            : `<img src="images/drapeau-anglais.png" alt="Anglais" class="drapeau-option" style="cursor:pointer;" onclick="changerLangue('en')">`;
    });

    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "👁️";
        } else {
            input.type = "password";
            btn.textContent = "🙈";
        }
    }

    function traiterInscription(event) {
        event.preventDefault();

        const nom = document.getElementById("nom").value.trim();
        const prenom = document.getElementById("prenom").value.trim();
        const email = document.getElementById("email").value.trim();
        const mdp = document.getElementById("mdp").value;
        const mdpConfirm = document.getElementById("mdp-confirm").value;
        const captchaAnswer = parseInt(document.getElementById("captcha-answer").value.trim(), 10);
        const mentions = document.getElementById("mentions").checked;
        const errorMsg = document.getElementById("error-message");

        const langue = localStorage.getItem("langue") || "fr";

        if (!nom || !prenom || !email || !mdp || !mdpConfirm) {
            errorMsg.textContent = langue === "en" ? "Please fill in all fields." : "Veuillez remplir tous les champs.";
            errorMsg.style.display = "block";
            return;
        }

        if (mdp !== mdpConfirm) {
            errorMsg.textContent = langue === "en" ? "Passwords do not match." : "Les mots de passe ne correspondent pas.";
            errorMsg.style.display = "block";
            return;
        }

        if (isNaN(captchaAnswer) || captchaAnswer !== reponseCaptcha) {
            errorMsg.textContent = langue === "en" ? "Incorrect Captcha answer. Please try again." : "Réponse au Captcha incorrecte. Veuillez réespérer.";
            errorMsg.style.display = "block";
            genererCaptcha();
            return;
        }

        if (!mentions) {
            errorMsg.textContent = langue === "en" ? "Please accept the terms of use." : "Veuillez accepter les conditions d'utilisation.";
            errorMsg.style.display = "block";
            return;
        }

        const userObj = {
            lastName: nom,
            firstName: prenom,
            email: email
        };
        localStorage.setItem("user", JSON.stringify(userObj));

        alert(langue === "en" ? "Account created successfully!" : "Compte créé avec succès !");
        window.location.href = "MonCompte.html";
    }
</script>
</body>
</html>
